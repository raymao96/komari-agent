stages:
  - build
  - release

workflow:
  rules:
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_PIPELINE_SOURCE == "web"'

variables:
  CGO_ENABLED: "0"

build:
  stage: build
  image: golang:1-bookworm
  rules:
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_PIPELINE_SOURCE == "web"'
  parallel:
    matrix:
      - GOOS: windows
        GOARCH: [amd64, arm64, "386"]
      - GOOS: linux
        GOARCH: [amd64, arm64, "386", arm]
      - GOOS: darwin
        GOARCH: [amd64, arm64]
      - GOOS: freebsd
        GOARCH: [amd64, arm64, "386", arm]
  script:
    - |
      VERSION="${CI_COMMIT_TAG:-dev-${CI_COMMIT_SHORT_SHA}}"
      BINARY_NAME="komari-agent-${GOOS}-${GOARCH}"
      if [ "$GOOS" = "windows" ]; then
        BINARY_NAME="${BINARY_NAME}.exe"
      fi
      echo "Building $BINARY_NAME (version=$VERSION)"
      go build -trimpath \
        -ldflags="-X github.com/komari-monitor/komari-agent/update.CurrentVersion=${VERSION}" \
        -o "$BINARY_NAME"
  artifacts:
    paths:
      - komari-agent-*
    expire_in: 1 week

attach_release_assets:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  needs: ["build"]
  rules:
    - if: '$CI_COMMIT_TAG && $CI_COMMIT_TAG !~ /-(rc|beta|alpha)/'

  before_script:
    - apk add --no-cache curl

  script:
    - |
      for f in komari-agent-*; do
        echo "Uploading $f to generic package registry"
        curl --fail --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
          --upload-file "$f" \
          "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/komari-agent/${CI_COMMIT_TAG}/${f}"
      done
  release:
    tag_name: "$CI_COMMIT_TAG"
    name: "$CI_COMMIT_TAG"
    description: "Release $CI_COMMIT_TAG"
    assets:
      links:
        - name: "komari-agent-windows-amd64.exe"
          url: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/komari-agent/${CI_COMMIT_TAG}/komari-agent-windows-amd64.exe"
        - name: "komari-agent-windows-arm64.exe"
          url: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/komari-agent/${CI_COMMIT_TAG}/komari-agent-windows-arm64.exe"
        - name: "komari-agent-windows-386.exe"
          url: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/komari-agent/${CI_COMMIT_TAG}/komari-agent-windows-386.exe"
        - name: "komari-agent-linux-amd64"
          url: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/komari-agent/${CI_COMMIT_TAG}/komari-agent-linux-amd64"
        - name: "komari-agent-linux-arm64"
          url: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/komari-agent/${CI_COMMIT_TAG}/komari-agent-linux-arm64"
        - name: "komari-agent-linux-386"
          url: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/komari-agent/${CI_COMMIT_TAG}/komari-agent-linux-386"
        - name: "komari-agent-linux-arm"
          url: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/komari-agent/${CI_COMMIT_TAG}/komari-agent-linux-arm"
        - name: "komari-agent-darwin-amd64"
          url: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/komari-agent/${CI_COMMIT_TAG}/komari-agent-darwin-amd64"
        - name: "komari-agent-darwin-arm64"
          url: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/komari-agent/${CI_COMMIT_TAG}/komari-agent-darwin-arm64"
        - name: "komari-agent-freebsd-amd64"
          url: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/komari-agent/${CI_COMMIT_TAG}/komari-agent-freebsd-amd64"
        - name: "komari-agent-freebsd-arm64"
          url: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/komari-agent/${CI_COMMIT_TAG}/komari-agent-freebsd-arm64"
        - name: "komari-agent-freebsd-386"
          url: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/komari-agent/${CI_COMMIT_TAG}/komari-agent-freebsd-386"
        - name: "komari-agent-freebsd-arm"
          url: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/komari-agent/${CI_COMMIT_TAG}/komari-agent-freebsd-arm"
